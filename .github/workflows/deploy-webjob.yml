name: Deploy Document Worker WebJob

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  deploy-webjob:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout Repository
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # Setup Python
      # ============================================================

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # Verify Required Files
      # ============================================================

      - name: Verify WebJob files
        run: |
          test -f App_Data/jobs/continuous/document-worker/run.py
          test -f document_processing.py
          test -f requirements.txt

          echo "Required files found."


      # ============================================================
      # Build WebJob Directory
      # ============================================================

      - name: Build WebJob package
        run: |
          rm -rf webjob-build
          rm -f document-worker.zip

          mkdir -p webjob-build

          cp \
            App_Data/jobs/continuous/document-worker/run.py \
            webjob-build/run.py

          cp \
            document_processing.py \
            webjob-build/document_processing.py

          mkdir -p \
            webjob-build/.python_packages/lib/site-packages


      # ============================================================
      # Install WebJob Dependencies
      # ============================================================

      - name: Install WebJob dependencies
        run: |
          python -m pip install \
            --upgrade pip

          python -m pip install \
            --target webjob-build/.python_packages/lib/site-packages \
            mssql-python \
            azure-identity \
            azure-storage-blob \
            pypdf \
            python-docx \
            openpyxl \
            python-pptx \
            openai \
            reportlab


      # ============================================================
      # Verify Python Packages
      # ============================================================

      - name: Verify WebJob dependencies
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/webjob-build/.python_packages/lib/site-packages:$GITHUB_WORKSPACE/webjob-build" \
          python -c "
          import reportlab
          import azure.identity
          import azure.storage.blob
          import pypdf
          import docx
          import openpyxl
          import pptx
          import openai
          import document_processing
          print('WebJob dependency validation successful.')
          "


      # ============================================================
      # Create WebJob ZIP
      # ============================================================

      - name: Create WebJob ZIP
        run: |
          cd webjob-build

          zip -r \
            "$GITHUB_WORKSPACE/document-worker.zip" \
            .

          cd "$GITHUB_WORKSPACE"

          echo ""
          echo "WebJob ZIP contents:"
          unzip -l document-worker.zip | head -100

          echo ""
          echo "WebJob ZIP size:"
          ls -lh document-worker.zip


      # ============================================================
      # Login to Azure
      # ============================================================

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EC80AB545A2D40D2A55F61019D86F9E4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D5A108B762904E43983C7CACFCB45BEE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3895FF762FCF49B88A7E84F98A94B5E1 }}


      # ============================================================
      # Determine SCM Hostname
      # ============================================================

      - name: Determine SCM hostname
        run: |
          DEFAULT_HOSTNAME=$(az webapp show \
            --resource-group rg-inframon-lab \
            --name app-inframon-mww \
            --query defaultHostName \
            --output tsv)

          APP_PREFIX="${DEFAULT_HOSTNAME%%.*}"
          REGION_HOST="${DEFAULT_HOSTNAME#*.}"

          SCM_HOSTNAME="${APP_PREFIX}.scm.${REGION_HOST}"

          echo "App hostname: $DEFAULT_HOSTNAME"
          echo "SCM hostname: $SCM_HOSTNAME"

          echo "SCM_HOSTNAME=$SCM_HOSTNAME" \
            >> "$GITHUB_ENV"


      # ============================================================
      # Deploy WebJob Only
      # ============================================================

      - name: Deploy document-worker WebJob
        run: |
          TOKEN=$(az account get-access-token \
            --query accessToken \
            --output tsv)

          echo "Uploading WebJob..."

          curl \
            --fail-with-body \
            --show-error \
            --request PUT \
            --header "Authorization: Bearer $TOKEN" \
            --header "Content-Type: application/zip" \
            --header "Content-Disposition: attachment; filename=document-worker.zip" \
            --data-binary "@document-worker.zip" \
            "https://${SCM_HOSTNAME}/api/zip/site/wwwroot/App_Data/jobs/continuous/document-worker/"

          echo ""
          echo "WebJob uploaded successfully."


      # ============================================================
      # Restart WebJob
      # ============================================================

      - name: Stop document-worker WebJob
        continue-on-error: true
        run: |
          TOKEN=$(az account get-access-token \
            --query accessToken \
            --output tsv)

          curl \
            --show-error \
            --request POST \
            --header "Authorization: Bearer $TOKEN" \
            "https://${SCM_HOSTNAME}/api/continuouswebjobs/document-worker/stop"


      - name: Start document-worker WebJob
        run: |
          TOKEN=$(az account get-access-token \
            --query accessToken \
            --output tsv)

          curl \
            --fail-with-body \
            --show-error \
            --request POST \
            --header "Authorization: Bearer $TOKEN" \
            "https://${SCM_HOSTNAME}/api/continuouswebjobs/document-worker/start"

          echo ""
          echo "WebJob started successfully."


      # ============================================================
      # Verify WebJob
      # ============================================================

      - name: Verify document-worker WebJob
        run: |
          TOKEN=$(az account get-access-token \
            --query accessToken \
            --output tsv)

          echo ""
          echo "WebJob status:"
          echo ""

          curl \
            --fail-with-body \
            --show-error \
            --header "Authorization: Bearer $TOKEN" \
            "https://${SCM_HOSTNAME}/api/continuouswebjobs/document-worker"

          echo ""