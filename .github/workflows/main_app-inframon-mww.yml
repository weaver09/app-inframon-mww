name: Deploy Python app to Azure Web App - app-inframon-mww

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout Repository
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # Verify WebJob Exists
      # ============================================================

      - name: Verify WebJob files
        run: |
          echo "Checking WebJob structure..."

          find App_Data -type f -print

          test -f App_Data/jobs/continuous/document-worker/run.py


      # ============================================================
      # Login to Azure using OIDC
      # ============================================================

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EC80AB545A2D40D2A55F61019D86F9E4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D5A108B762904E43983C7CACFCB45BEE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3895FF762FCF49B88A7E84F98A94B5E1 }}


      # ============================================================
      # Deploy Main Application
      #
      # Azure App Service / Oryx installs requirements.txt.
      # ============================================================

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-inframon-mww
          slot-name: Production
          package: .


      # ============================================================
      # Deploy WebJob Files Explicitly
      #
      # Put run.py directly in the WebJobs discovery location.
      # ============================================================

      - name: Deploy WebJob
        run: |
          az webapp deploy \
            --resource-group rg-inframon-lab \
            --name app-inframon-mww \
            --type static \
            --src-path App_Data/jobs/continuous/document-worker/run.py \
            --target-path App_Data/jobs/continuous/document-worker/run.py \
            --restart false


      # ============================================================
      # Verify Azure Sees Continuous WebJobs
      # ============================================================

      - name: List WebJobs
        run: |
          az webapp webjob continuous list \
            --resource-group rg-inframon-lab \
            --name app-inframon-mww \
            --output table