name: Deploy Python app to Azure Web App - app-inframon-mww

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout Repository
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # Setup Python
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # Verify WebJob
      # ============================================================

      - name: Verify WebJob structure
        run: |
          echo "Checking WebJob..."

          test -f App_Data/jobs/continuous/document-worker/run.py

          find App_Data -type f -print


      # ============================================================
      # Build Deployment Folder
      # ============================================================

      - name: Build deployment package
        run: |
          rm -rf deployment
          mkdir -p deployment

          echo "Copying application files..."

          cp app.py deployment/
          cp document_processing.py deployment/
          cp requirements.txt deployment/

          cp -R templates deployment/templates
          cp -R App_Data deployment/App_Data

          if [ -d static ]; then
            cp -R static deployment/static
          fi


      # ============================================================
      # Install Dependencies Into Deployment Package
      # ============================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          mkdir -p deployment/.python_packages/lib/site-packages

          pip install \
            -r requirements.txt \
            --target deployment/.python_packages/lib/site-packages


      # ============================================================
      # Verify Deployment Contents
      # ============================================================

      - name: Verify deployment contents
        run: |
          echo "Deployment files:"

          find deployment -maxdepth 6 -type f | sort

          echo ""
          echo "Checking Flask app..."

          test -f deployment/app.py

          echo ""
          echo "Checking WebJob..."

          test -f deployment/App_Data/jobs/continuous/document-worker/run.py


      # ============================================================
      # Create ZIP Package
      # ============================================================

      - name: Create deployment ZIP
        run: |
          cd deployment

          zip -r ../deployment.zip .

          cd ..

          echo "Deployment ZIP created:"
          ls -lh deployment.zip


      # ============================================================
      # Azure Login
      # ============================================================

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EC80AB545A2D40D2A55F61019D86F9E4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D5A108B762904E43983C7CACFCB45BEE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3895FF762FCF49B88A7E84F98A94B5E1 }}


      # ============================================================
      # Disable Azure/Oryx Build
      #
      # Dependencies were already installed above by GitHub.
      # ============================================================

      - name: Configure deployment settings
        run: |
          az webapp config appsettings set \
            --resource-group rg-inframon-lab \
            --name app-inframon-mww \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITE_SKIP_RUNNING_KUDUAGENT=false \
              WEBSITES_ENABLE_APP_SERVICE_STORAGE=true


      # ============================================================
      # Deploy Entire Application + WebJob
      # ============================================================

      - name: Deploy application package
        run: |
          az webapp deploy \
            --resource-group rg-inframon-lab \
            --name app-inframon-mww \
            --src-path deployment.zip \
            --type zip


      # ============================================================
      # Verify WebJob
      # ============================================================

      - name: List continuous WebJobs
        run: |
          az webapp webjob continuous list \
            --resource-group rg-inframon-lab \
            --name app-inframon-mww \
            --output table