name: Deploy Python app to Azure Web App - app-inframon-mww

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout Repository
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # Verify Required Files
      # ============================================================

      - name: Verify application files
        run: |
          test -f app.py
          test -f document_processing.py
          test -f requirements.txt
          test -f App_Data/jobs/continuous/document-worker/run.py

          echo "Application files verified."
          echo ""
          echo "WebJob files:"
          find App_Data/jobs/continuous/document-worker -type f -print


      # ============================================================
      # Login to Azure
      # ============================================================

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EC80AB545A2D40D2A55F61019D86F9E4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D5A108B762904E43983C7CACFCB45BEE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3895FF762FCF49B88A7E84F98A94B5E1 }}


      # ============================================================
      # Deploy Main Flask Application
      # ============================================================

      - name: Deploy main application
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-inframon-mww
          slot-name: Production
          package: .


      # ============================================================
      # Package WebJob
      #
      # run.py will be at the root of the ZIP.
      # ============================================================

      - name: Package WebJob
        run: |
          rm -f document-worker.zip

          cd App_Data/jobs/continuous/document-worker

          zip -r "$GITHUB_WORKSPACE/document-worker.zip" .

          cd "$GITHUB_WORKSPACE"

          echo ""
          echo "WebJob package contents:"
          unzip -l document-worker.zip


      # ============================================================
      # Determine SCM Hostname
      # ============================================================

      - name: Determine SCM hostname
        run: |
          DEFAULT_HOSTNAME=$(az webapp show \
            --resource-group rg-inframon-lab \
            --name app-inframon-mww \
            --query defaultHostName \
            --output tsv)

          APP_PREFIX="${DEFAULT_HOSTNAME%%.*}"
          REGION_HOST="${DEFAULT_HOSTNAME#*.}"

          SCM_HOSTNAME="${APP_PREFIX}.scm.${REGION_HOST}"

          echo "App hostname: $DEFAULT_HOSTNAME"
          echo "SCM hostname: $SCM_HOSTNAME"

          echo "SCM_HOSTNAME=$SCM_HOSTNAME" >> "$GITHUB_ENV"


      # ============================================================
      # Deploy Continuous WebJob
      #
      # Upload ZIP directly into:
      # App_Data/jobs/continuous/document-worker
      # ============================================================

      - name: Deploy document-worker WebJob
        run: |
          TOKEN=$(az account get-access-token \
            --query accessToken \
            --output tsv)

          echo "Uploading document-worker.zip..."

          curl \
            --fail-with-body \
            --show-error \
            --request PUT \
            --header "Authorization: Bearer $TOKEN" \
            --header "Content-Type: application/zip" \
            --header "Content-Disposition: attachment; filename=document-worker.zip" \
            --data-binary "@document-worker.zip" \
            "https://${SCM_HOSTNAME}/api/zip/site/wwwroot/App_Data/jobs/continuous/document-worker/"

          echo ""
          echo "WebJob files uploaded successfully."


      # ============================================================
      # Start Continuous WebJob
      # ============================================================

      - name: Start document-worker WebJob
        run: |
          az webapp webjob continuous start \
            --resource-group rg-inframon-lab \
            --name app-inframon-mww \
            --webjob-name document-worker


      # ============================================================
      # Verify Continuous WebJobs
      # ============================================================

      - name: List continuous WebJobs
        run: |
          az webapp webjob continuous list \
            --resource-group rg-inframon-lab \
            --name app-inframon-mww \
            --output table